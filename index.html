<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#221710" />
<title>相性检定</title>
<style>/* ============================================================
   oc-kit 路 绾镐笌鍗?   涓€濂楃粰 OC 鍦堝瓙鎺ュ崟鐢ㄧ殑鍗曟枃浠跺皬宸ュ叿鐨偆銆?   ============================================================ */

:root {
  --paper: #ece3d1;
  --paper-hi: #f4ecdc;
  --ink: #1b1a17;
  --ink-soft: #4f483c;
  --ink-faint: #857b6a;
  --red: #a32b22;
  --red-deep: #7d1d16;
  --line: rgba(27, 26, 23, 0.26);
  --line-soft: rgba(27, 26, 23, 0.14);
  --serif: "Songti SC", "STSong", "Noto Serif SC", SimSun, "Times New Roman", serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --mono: "SFMono-Regular", "Consolas", "Courier New", monospace;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(14px, 4vw, 48px) clamp(10px, 3vw, 32px);
  font-family: var(--sans);
  color: var(--ink);
  background-color: #2b1e17;
  background-image:
    repeating-linear-gradient(92deg, rgba(0, 0, 0, 0.17) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(88deg, rgba(255, 236, 210, 0.035) 0 1px, transparent 1px 11px),
    radial-gradient(ellipse 120% 80% at 50% -10%, #4b3526 0%, transparent 62%),
    linear-gradient(158deg, #33241a 0%, #1c130e 100%);
  background-attachment: fixed;
}

.app {
  width: 100%;
  max-width: 560px;
}

.noscript {
  color: var(--paper);
  font-family: var(--sans);
  text-align: center;
}

/* ---------- 绾稿紶 ---------- */

.sheet {
  position: relative;
  padding: clamp(20px, 5vw, 34px) clamp(18px, 4.6vw, 34px) clamp(16px, 4vw, 26px);
  background-color: var(--paper);
  background-image:
    radial-gradient(ellipse 90% 60% at 18% 0%, rgba(255, 255, 255, 0.55), transparent 60%),
    radial-gradient(ellipse 80% 70% at 88% 100%, rgba(60, 40, 20, 0.12), transparent 60%),
    repeating-linear-gradient(0deg, rgba(60, 40, 20, 0.035) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(60, 40, 20, 0.022) 0 1px, transparent 1px 4px);
  border: 1px solid rgba(27, 26, 23, 0.55);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.35) inset,
    0 0 0 1px rgba(255, 255, 255, 0.08),
    0 18px 34px -18px rgba(0, 0, 0, 0.75),
    0 42px 70px -40px rgba(0, 0, 0, 0.8);
  animation: sheet-in 0.42s cubic-bezier(0.22, 0.9, 0.3, 1) both;
}

/* 宸︿晶瑁呰绾㈢嚎 */
.sheet::before {
  content: "";
  position: absolute;
  top: clamp(14px, 3.6vw, 26px);
  bottom: clamp(14px, 3.6vw, 26px);
  left: clamp(8px, 2vw, 13px);
  width: 1px;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(163, 43, 34, 0.5) 12%,
    rgba(163, 43, 34, 0.5) 88%,
    transparent
  );
}

/* 鍥涜瑁佸垏鏍囪 */
.sheet::after {
  content: "";
  position: absolute;
  inset: 6px;
  pointer-events: none;
  background-image:
    linear-gradient(to right, var(--line-soft) 8px, transparent 8px),
    linear-gradient(to bottom, var(--line-soft) 8px, transparent 8px),
    linear-gradient(to left, var(--line-soft) 8px, transparent 8px),
    linear-gradient(to bottom, var(--line-soft) 8px, transparent 8px),
    linear-gradient(to right, var(--line-soft) 8px, transparent 8px),
    linear-gradient(to top, var(--line-soft) 8px, transparent 8px),
    linear-gradient(to left, var(--line-soft) 8px, transparent 8px),
    linear-gradient(to top, var(--line-soft) 8px, transparent 8px);
  background-position: left top, left top, right top, right top, left bottom, left bottom, right bottom, right bottom;
  background-size: 8px 1px, 1px 8px, 8px 1px, 1px 8px, 8px 1px, 1px 8px, 8px 1px, 1px 8px;
  background-repeat: no-repeat;
}

@keyframes sheet-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.995);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ---------- 椤电湁椤佃剼 ---------- */

.sheet-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 9px;
  margin-bottom: clamp(16px, 4vw, 26px);
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--ink-faint);
  text-transform: uppercase;
}

.sheet-head b {
  color: var(--ink);
  font-weight: 600;
}

.sheet-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: clamp(18px, 4.5vw, 28px);
  padding-top: 10px;
  border-top: 1px solid var(--line-soft);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
}

/* ---------- 灏侀潰 ---------- */

.kicker {
  margin: 0 0 10px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.22em;
  color: var(--red);
}

.title {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(38px, 11vw, 58px);
  font-weight: 700;
  line-height: 1.04;
  letter-spacing: 0.04em;
}

.title .thin {
  color: var(--ink-faint);
  font-weight: 400;
}

.lead {
  margin: 16px 0 0;
  max-width: 34em;
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.85;
  color: var(--ink-soft);
  text-align: justify;
}

.games {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 16px;
}

.games span {
  padding: 3px 8px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--ink-faint);
  border: 1px solid var(--line-soft);
}

.rule {
  height: 1px;
  margin: clamp(20px, 5vw, 28px) 0 0;
  background: linear-gradient(to right, var(--ink) 0 46px, var(--line-soft) 46px);
}

/* ---------- 琛ㄥ崟 ---------- */

.form {
  display: grid;
  gap: 14px;
  margin-top: 22px;
}

.field {
  display: grid;
  grid-template-columns: 3.4em 1fr;
  align-items: center;
  gap: 10px;
}

.field > span {
  font-family: var(--serif);
  font-size: 13px;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
}

.field input {
  width: 100%;
  padding: 9px 2px 8px;
  font-family: var(--serif);
  font-size: 16px;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  outline: none;
  transition: border-color 0.18s ease;
}

.field input::placeholder {
  color: rgba(133, 123, 106, 0.65);
}

.field input:focus {
  border-bottom-color: var(--red);
}

/* ---------- 鎸夐挳 ---------- */

.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin-top: 24px;
  padding: 15px 20px;
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--paper-hi);
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 1px;
  cursor: pointer;
  transition: background 0.16s ease, transform 0.12s ease;
}

.cta:hover {
  background: var(--red-deep);
  border-color: var(--red-deep);
}

.cta:active {
  transform: translateY(1px);
}

.cta::after {
  content: "鈫?;
  font-family: var(--sans);
  letter-spacing: 0;
}

.hint {
  margin: 14px 0 0;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  text-align: center;
}

/* ---------- 杩涘害 ---------- */

.progress {
  display: flex;
  gap: 4px;
  margin-bottom: clamp(20px, 5vw, 30px);
}

.progress i {
  flex: 1;
  height: 3px;
  background: var(--line-soft);
  transition: background 0.25s ease;
}

.progress i.on {
  background: var(--red);
}

/* ---------- 绛旈 ---------- */

.qno {
  margin: 0 0 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.2em;
  color: var(--ink-faint);
}

.qno em {
  font-style: normal;
  color: var(--red);
}

.q {
  margin: 0 0 clamp(20px, 5vw, 28px);
  font-family: var(--serif);
  font-size: clamp(20px, 5.2vw, 25px);
  font-weight: 600;
  line-height: 1.55;
  letter-spacing: 0.02em;
  text-wrap: pretty;
}

.opts {
  display: grid;
  gap: 9px;
}

.opt {
  display: grid;
  grid-template-columns: 26px 1fr;
  align-items: start;
  gap: 12px;
  width: 100%;
  padding: 14px 14px 14px 12px;
  text-align: left;
  font-family: var(--serif);
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.22);
  border: 1px solid var(--line-soft);
  border-radius: 1px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}

.opt:hover {
  background: rgba(255, 255, 255, 0.55);
  border-color: var(--line);
}

.opt:active {
  transform: translateY(1px);
}

.opt-idx {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.9;
  color: var(--red);
}

.opt.picked {
  background: rgba(163, 43, 34, 0.08);
  border-color: var(--red);
}

/* ---------- 缁撴灉 ---------- */

.pair {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 0 0 18px;
  font-family: var(--serif);
  font-size: 17px;
  letter-spacing: 0.06em;
  color: var(--ink);
}

.pair .cross {
  color: var(--red);
  font-size: 13px;
}

.pair .sub {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
}

.scoreline {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 16px;
}

.pct {
  font-family: var(--serif);
  font-size: clamp(72px, 22vw, 108px);
  font-weight: 700;
  line-height: 0.86;
  letter-spacing: -0.02em;
  font-variant-numeric: lining-nums tabular-nums;
}

.pct small {
  font-size: 0.28em;
  letter-spacing: 0;
  color: var(--ink-faint);
  margin-left: 4px;
}

.grade {
  padding-bottom: 8px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
}

.grade b {
  display: block;
  margin-top: 4px;
  font-family: var(--serif);
  font-size: 26px;
  letter-spacing: 0.1em;
  color: var(--red);
}

.bar {
  position: relative;
  height: 5px;
  margin: 20px 0 0;
  background: var(--line-soft);
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--red);
  transform-origin: left center;
  animation: bar-grow 0.9s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes bar-grow {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}

.stamp {
  position: absolute;
  top: -6px;
  right: 0;
  width: clamp(78px, 20vw, 96px);
  height: clamp(78px, 20vw, 96px);
  display: grid;
  place-items: center;
  color: var(--red);
  border: 3px solid var(--red);
  border-radius: 50%;
  box-shadow: 0 0 0 1.5px var(--red) inset;
  opacity: 0;
  transform: rotate(-11deg) scale(1.6);
  animation: stamp-drop 0.34s 0.5s cubic-bezier(0.3, 1.5, 0.5, 1) both;
  mix-blend-mode: multiply;
}

@keyframes stamp-drop {
  to {
    opacity: 0.88;
    transform: rotate(-11deg) scale(1);
  }
}

.stamp span {
  display: grid;
  gap: 3px;
  font-family: var(--serif);
  font-size: clamp(16px, 4vw, 19px);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: 0.1em;
  text-indent: 0.1em;
  text-align: center;
}

.stamp span span {
  display: block;
}

.comment {
  margin: clamp(22px, 5.5vw, 30px) 0 0;
  padding-left: 14px;
  border-left: 2px solid var(--red);
  font-family: var(--serif);
  font-size: 14.5px;
  line-height: 1.95;
  color: var(--ink-soft);
  text-align: justify;
}

.traits {
  display: grid;
  gap: 0;
  margin: clamp(20px, 5vw, 26px) 0 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--line-soft);
}

.traits li {
  display: grid;
  grid-template-columns: 3em 1fr;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line-soft);
  font-family: var(--serif);
  font-size: 13.5px;
  letter-spacing: 0.04em;
}

.traits li em {
  font-family: var(--mono);
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ink-faint);
  align-self: center;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: clamp(22px, 5vw, 30px);
}

.btn {
  padding: 13px 12px;
  font-family: var(--serif);
  font-size: 13.5px;
  letter-spacing: 0.12em;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--ink);
  border-radius: 1px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.btn:hover {
  background: var(--ink);
  color: var(--paper-hi);
}

.btn--solid {
  grid-column: 1 / -1;
  background: var(--ink);
  color: var(--paper-hi);
}

.btn--solid:hover {
  background: var(--red-deep);
  border-color: var(--red-deep);
}

.btn:active {
  transform: translateY(1px);
}

/* ---------- 鍏朵粬 ---------- */

.linkbtn {
  padding: 0;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  background: none;
  border: 0;
  cursor: pointer;
}

.linkbtn:hover {
  color: var(--red);
}

.sheet--quiz {
  animation-duration: 0.26s;
}

/* ---------- 閲忚〃锛圠ikert锛?---------- */

.scale {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-top: 10px;
}

.scale-dot {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 16px;
  color: var(--ink-soft);
  background: rgba(255, 255, 255, 0.28);
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}

.scale-dot:hover {
  border-color: var(--ink);
}

.scale-dot:active {
  transform: scale(0.94);
}

.scale-dot.on {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper-hi);
}

.scale-ends {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink-faint);
}

/* ---------- 瑙掕壊鍖归厤缁撴灉 ---------- */

.cast-name {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(40px, 12vw, 64px);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: 0.06em;
}

.cast-meta {
  margin: 9px 0 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
}

.dual {
  display: grid;
  gap: 9px;
  margin-top: 18px;
}

.dual-row {
  display: grid;
  grid-template-columns: 2.6em 1fr 2.4em;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-faint);
}

.dual-row i {
  position: relative;
  display: block;
  height: 5px;
  background: var(--line-soft);
}

.dual-row i b {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  background: var(--red);
}

.dual-row em {
  font-style: normal;
  text-align: right;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.attach {
  margin: 16px 0 0;
  font-family: var(--serif);
  font-size: 13.5px;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
}

.attach b {
  color: var(--red);
  font-weight: 600;
}

.attach span {
  margin: 0 8px;
  color: var(--ink-faint);
}

.dims {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.dims span {
  padding: 3px 8px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--ink-faint);
  border: 1px solid var(--line-soft);
}

.dims b {
  margin-left: 5px;
  font-weight: 600;
  color: var(--ink);
}

.cast-note {
  margin: 14px 0 0;
  font-family: var(--serif);
  font-size: 13px;
  line-height: 1.9;
  color: var(--ink-soft);
}

.disclaimer {
  margin: 18px 0 0;
  font-family: var(--mono);
  font-size: 9.5px;
  line-height: 1.7;
  letter-spacing: 0.04em;
  color: var(--ink-faint);
  text-align: center;
}

.card-preview {
  display: block;
  width: 100%;
  height: auto;
  box-shadow: 0 30px 70px -34px rgba(0, 0, 0, 0.9);
}

/* ---------- 出图弹层 ---------- */

.card-modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(14, 9, 6, 0.88);
  animation: modal-in 0.2s ease both;
}

.card-modal-inner {
  width: min(430px, 100%);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-modal-img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 62vh;
  object-fit: contain;
  box-shadow: 0 30px 60px -30px #000;
  -webkit-touch-callout: default;
  user-select: none;
}

.card-modal-tip {
  margin: 0;
  text-align: center;
  font-family: var(--sans);
  font-size: 11.5px;
  letter-spacing: 0.06em;
  color: rgba(236, 227, 209, 0.72);
}

.card-modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.card-modal .btn {
  color: var(--paper-hi);
  border-color: rgba(236, 227, 209, 0.45);
}

.card-modal .btn:hover {
  background: var(--paper-hi);
  color: var(--ink);
}

.card-modal .btn--solid {
  grid-column: 1 / -1;
  background: var(--paper-hi);
  border-color: var(--paper-hi);
  color: var(--ink);
}

.card-modal .btn--solid:hover {
  background: var(--red);
  border-color: var(--red);
  color: var(--paper-hi);
}

@keyframes modal-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  z-index: 9;
  padding: 10px 18px;
  transform: translate(-50%, 12px);
  font-family: var(--sans);
  font-size: 12.5px;
  letter-spacing: 0.06em;
  color: var(--paper-hi);
  background: rgba(27, 26, 23, 0.94);
  border-radius: 2px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast.on {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 420px) {
  .sheet-head {
    font-size: 9.5px;
  }
  .actions {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  .sheet,
  .bar i,
  .stamp,
  .card-modal {
    animation: none !important;
  }

<script>/* ============================================================
   oc-kit · engine
   配置驱动：换一个 config，就是另一个产品。
   支持两种结算方式：
     mode: "match" —— 累加选项分值，换算出百分比 + 区间结论（相性检定）
     mode: "pick"  —— 统计选项归属，取最高者（你是哪个 OC / 抽签）
   ============================================================ */

(function () {
  "use strict";

  var CFG = window.__OC_CONFIG__ || {};
  var app = document.getElementById("app");
  var state = {
    step: "cover",
    qi: 0,
    picks: [],
    items: [],
    target: null,
    a: "",
    b: ""
  };

  /* ---------------- 小工具 ---------------- */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function pad(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function today() {
    var d = new Date();
    return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate());
  }

  function toast(msg) {
    var el = document.querySelector(".toast");
    if (!el) {
      el = document.createElement("div");
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () {
      el.classList.remove("on");
    }, 1900);
  }

  /* ---------------- 结算 ---------------- */

  function compute() {
    if (CFG.mode === "cast") return computeCast();

    var qs = CFG.questions || [];
    var total = 0;
    var max = 0;

    if (CFG.mode === "pick") {
      var tally = {};
      qs.forEach(function (q, i) {
        var opt = q.options[state.picks[i]];
        if (!opt) return;
        var key = opt.key || opt.label;
        tally[key] = (tally[key] || 0) + 1;
      });
      var best = null;
      Object.keys(tally).forEach(function (k) {
        if (!best || tally[k] > tally[best]) best = k;
      });
      var results = CFG.results || [];
      var hit = null;
      results.forEach(function (r) {
        if (r.id === best) hit = r;
      });
      return { kind: "pick", result: hit || results[0], tally: tally };
    }

    qs.forEach(function (q, i) {
      var opt = q.options[state.picks[i]];
      var qMax = 0;
      q.options.forEach(function (o) {
        if ((o.score || 0) > qMax) qMax = o.score || 0;
      });
      max += qMax;
      total += opt ? opt.score || 0 : 0;
    });

    var pct = max > 0 ? Math.round((total / max) * 100) : 0;
    var jitter = (hash(state.a + "|" + state.b) % 5) - 2;
    pct = Math.max(1, Math.min(100, pct + jitter));

    var bands = (CFG.bands || []).slice().sort(function (x, y) {
      return x.min - y.min;
    });
    var band = bands[0];
    bands.forEach(function (b) {
      if (pct >= b.min) band = b;
    });

    return { kind: "match", pct: pct, band: band, total: total, max: max };
  }

  function refNo() {
    var seed = hash(state.a + state.b + CFG.meta.title);
    // 注意用 >>> ：hash 是无符号 32 位，>> 会变成负数，编号里会冒出 "--69"
    return (CFG.meta.refPrefix || "OC") + "-" + String((seed % 9000) + 1000) + "-" + String(((seed >>> 5) % 90) + 10);
  }

  /* ---------------- 渲染 ---------------- */

  function head(left, right) {
    return (
      '<header class="sheet-head"><span>' +
      left +
      "</span><span>" +
      right +
      "</span></header>"
    );
  }

  function foot(left, right) {
    return (
      '<footer class="sheet-foot"><span>' +
      left +
      "</span><span>" +
      right +
      "</span></footer>"
    );
  }

  function renderCover() {
    var c = CFG.cover || {};
    var input = CFG.input !== false;
    var form = "";

    if (input) {
      form =
        '<div class="form">' +
        '<label class="field"><span>' +
        esc(CFG.meta.labelA || "你") +
        '</span><input data-bind="a" maxlength="18" autocomplete="off" placeholder="' +
        esc(CFG.meta.placeholderA || "输入名字") +
        '" /></label>' +
        '<label class="field"><span>' +
        esc(CFG.meta.labelB || "对象") +
        '</span><input data-bind="b" maxlength="18" autocomplete="off" placeholder="' +
        esc(CFG.meta.placeholderB || "输入名字") +
        '" /></label>' +
        "</div>";
    }

    app.innerHTML =
      '<section class="sheet">' +
      head("<span>" + esc(CFG.meta.refLabel || "档案编号") + " <b>" + esc(refNo()) + "</b></span>", "<span>" + today() + "</span>") +
      '<div class="sheet-body">' +
      '<p class="kicker">' + esc(c.kicker || "机密 · 仅限当事人查阅") + "</p>" +
      '<h1 class="title">' + (c.title || "相性检定") + "</h1>" +
      (c.lead ? '<p class="lead">' + esc(c.lead) + "</p>" : "") +
      (c.games && c.games.length
        ? '<div class="games">' +
          c.games
            .map(function (g) {
              return "<span>" + esc(g) + "</span>";
            })
            .join("") +
          "</div>"
        : "") +
      '<div class="rule"></div>' +
      form +
      '<button class="cta" data-action="start">' + esc(c.cta || "开始检定") + "</button>" +
      (c.hint ? '<p class="hint">' + esc(c.hint) + "</p>" : "") +
      "</div>" +
      foot("签发 · " + esc(CFG.meta.author || ""), "第 1 / 3 页") +
      "</section>";

    var a = app.querySelector('[data-bind="a"]');
    if (a && !("ontouchstart" in window)) a.focus({ preventScroll: true });
  }

  function renderQuiz() {
    var q = state.items[state.qi];
    var n = state.items.length;
    var pctDone = Math.round(((state.qi + 1) / n) * 100);
    var segs = "";
    for (var i = 0; i < n; i++) {
      segs += '<i class="' + (i <= state.qi ? "on" : "") + '"></i>';
    }

    var opts = "";
    var optsInner = "";

    if (CFG.likert) {

  function stampHTML(text) {
    var t = String(text || "").trim();
    if (!t) return "";
    var half = Math.ceil(t.length / 2);
    return (
      '<span class="stamp"><span><span>' +
      esc(t.slice(0, half)) +
      "</span><span>" +
      esc(t.slice(half)) +
      "</span></span></span>"
    );
  }

  function traitsList(list) {
    var out = '<ul class="traits">';
    list.forEach(function (t, i) {
      out += '<li><em>' + pad(i + 1) + "</em><span>" + esc(t) + "</span></li>";
    });
    return out + "</ul>";
  }

  /* ---------------- cast：量表 + 角色库 ---------------- */

  function clamp01(x) {
    return x < 0 ? 0 : x > 1 ? 1 : x;
  }

  function attachType(ax, av) {
    var a = ax >= 50;
    var v = av >= 50;
    if (!a && !v) return "安全型";
    if (a && !v) return "痴迷型";
    if (!a && v) return "疏离型";
    return "恐惧型";
  }

  function collectVector(who) {
    var sum = {};
    var cnt = {};
    var len = (CFG.likert || []).length || 5;
    state.items.forEach(function (q, i) {
      if ((q.who || "self") !== who) return;
      var idx = state.picks[i];
      if (idx == null) return;
      var val = q.reverse ? len - idx : idx + 1;
      var norm = ((val - 1) / (len - 1)) * 100;
      sum[q.dim] = (sum[q.dim] || 0) + norm;
      cnt[q.dim] = (cnt[q.dim] || 0) + 1;
    });
    var v = {};
    Object.keys(sum).forEach(function (k) {
      v[k] = sum[k] / cnt[k];
    });
    return v;
  }

  function castVector() {
    return collectVector("self");
  }

  /** 不知道TA是谁的时候，用这六道题现估一个人的坐标 */
  function partnerVector(u) {
    var p = collectVector("partner");
    var pick = function (k, fallback) {
      return p[k] != null ? p[k] : fallback;
    };
    return {
      O: u.O || 50,
      C: pick("C", 50),
      E: pick("E", 50),
      A: pick("A", 50),
      N: 50 + (pick("AV", 50) - 50) * 0.3,
      AX: pick("AX", 50),
      AV: pick("AV", 50),
      DOM: pick("DOM", 50)
    };
  }

  /** 对上名字后的合成坐标：以已有画像为底，按「你眼中的TA」修正两成。 */
  function blendVector(base, mine, w) {
    var out = { O: base.O != null ? base.O : 50 };
    ["C", "E", "A", "N", "AX", "AV", "DOM"].forEach(function (k) {
      var b = base[k] != null ? base[k] : 50;
      var m = mine[k] != null ? mine[k] : b;
      out[k] = b * (1 - w) + m * w;
    });
    return out;
  }

  /** 名字归一化：去空格标点、去称谓、小写 */
  function normName(s) {
    return String(s || "")
      .toLowerCase()
      .replace(/[\s·・.、,，。!！?？'"“”‘’()（）\-_]/g, "")
      .replace(/(老师|先生|医生|大人|阁下)$/g, "");
  }

  /**
   * 对上名字：先精确匹配（角色名 / 拼音 id / 别名），再退回包含匹配。
   * 对上了就用TA的名字和画像，对不上就当场估一个。
   */
  function findCast(name) {
    var q = normName(name);
    if (!q) return null;
    var list = CFG.cast || [];

    for (var i = 0; i < list.length; i++) {
      var names = [list[i].name, list[i].id].concat(list[i].aliases || []);
      for (var j = 0; j < names.length; j++) {
        if (normName(names[j]) === q) return list[i];
      }
    }

    if (q.length < 2) return null;

    var best = null;
    var bestLen = 0;
    for (var m = 0; m < list.length; m++) {
      var nn = [list[m].name, list[m].id].concat(list[m].aliases || []);
      for (var k = 0; k < nn.length; k++) {
        var s = normName(nn[k]);
        if (s.length < 2) continue;
        if ((q.indexOf(s) >= 0 || s.indexOf(q) >= 0) && s.length > bestLen) {
          best = list[m];
          bestLen = s.length;
        }
      }
    }
    return best;
  }

  /** ★ 文案：不知道 TA 什么样时，从向量反推三条特征。这些词可以直接换成你的说法 */
  function deriveTraits(v) {
    var cand = [
      { k: "E", hi: "话多", lo: "话少" },
      { k: "A", hi: "温和", lo: "有棱角" },
      { k: "DOM", hi: "主导", lo: "随和" },
      { k: "AX", hi: "需要确认", lo: "不黏人" },
      { k: "AV", hi: "习惯后退", lo: "愿意靠近" },
      { k: "C", hi: "靠谱", lo: "随性" }
    ];
    cand.forEach(function (c) {
      c.w = Math.abs((v[c.k] || 50) - 50);
    });
    cand.sort(function (a, b) {
      return b.w - a.w;
    });
    return cand.slice(0, 3).map(function (c) {
      return (v[c.k] || 50) >= 50 ? c.hi : c.lo;
    });
  }

  /** ★ 文案：不知道 TA 什么样时，从向量反推一句人物侧写 */
  function describeOther(v) {
    var e = v.E >= 55 ? "话不少，和人打交道很自然" : v.E <= 45 ? "话不多，习惯先听" : "话不多不少";
    var dom =
      v.DOM >= 55 ? "更常是拿主意的那一个" : v.DOM <= 45 ? "更愿意跟着你的节奏走" : "和你差不多，谁有理听谁的";
    var av = v.AV >= 55 ? "会先退半步" : v.AV <= 45 ? "不太设防" : "看情况";
    return "TA" + e + "；在关系里" + dom + "；遇到有人靠近，TA" + av + "。";
  }


  /**
   * 配对打分。
   *
   * 相似度与支配互补是主项，依恋只作为调节项——早期版本把「安全感」放进主项，
   * 结果它对每个角色的取值几乎相同，所有人的分数都被压成 68/68/68，区分不出来。
   *
   *   相似度   —— 宜人、尽责、开放三维的接近程度（价值观与生活节奏）
   *   支配互补 —— 一方主导、另一方退让，比两个都强势更容易走远
   *   安全调节 —— 双方依恋安全水平，相对 0.55 上下浮动
   *   陷阱扣分 —— 追求者遇上撤退者，最典型的消耗组合
   */
  function pairScore(u, c) {
    // 差距用 0.65 次幂放大：性格差 10 分和差 30 分，体感差别远大于线性，
    // 而且线性会让不同人的分数贴在一起，区分不出来。
    var g = function (k) {
      return Math.pow(Math.abs((u[k] || 0) - (c[k] || 0)) / 100, 0.65);
    };

    var sim = 1 - (g("A") * 0.4 + g("C") * 0.3 + g("O") * 0.3);
    var comp = 1 - Math.pow(Math.abs(u.DOM - (100 - c.DOM)) / 100, 0.65);

    var su = 1 - (u.AX + u.AV) / 200;
    var sc = 1 - (c.AX + c.AV) / 200;
    var sec = Math.min(su, sc) * 0.7 + ((su + sc) / 2) * 0.3;

    var trap = 0;
    if (u.AX > 50 && c.AV > 50) trap = Math.max(trap, Math.min(u.AX - 50, c.AV - 50) / 50);
    if (u.AV > 50 && c.AX > 50) trap = Math.max(trap, Math.min(u.AV - 50, c.AX - 50) / 50);

    var fit = clamp01(0.66 * sim + 0.34 * comp + 0.16 * (sec - 0.55) - 0.16 * trap);

    var energy = 1 - (g("E") * 0.6 + g("N") * 0.4);
    var tension = clamp01(0.55 * energy + 0.3 * trap + 0.15 * (1 - comp));
    var total = clamp01(0.74 * fit + 0.26 * tension);

    return { fit: fit, tension: tension, total: total, trap: trap };
  }

  function gradeOf(s) {
    if (s >= 85) return "特";
    if (s >= 76) return "甲";
    if (s >= 67) return "乙";
    if (s >= 58) return "丙";
    return "丁";
  }

  function decorate(x) {
    // 契合是主项，张力只做小幅加减：张力高说明有火，张力低也不该把总分拖垮。
    // 这样「相性」始终贴着「契合」走，不会出现 89% 配 71/45 的自相矛盾。
    x.dfit = 100 * Math.pow(x.fit, 0.8);
    x.dten = 100 * Math.pow(x.tension, 0.8);
    x.score = Math.round(Math.max(5, Math.min(99, x.dfit + (x.dten - 55) * 0.18)));
    return x;
  }

  function computeCast() {
    var u = castVector();
    var uType = attachType(u.AX || 0, u.AV || 0);
    var target = state.target || null;

    var list = (CFG.cast || []).map(function (ch) {
      var p = pairScore(u, ch.v);
      return decorate({
        ch: ch,
        fit: p.fit,
        tension: p.tension,
        trap: p.trap,
        raw: p.total,
        uType: uType,
        cType: attachType(ch.v.AX, ch.v.AV)
      });
    });

    list.sort(function (a, b) {
      return b.score - a.score || b.dfit - a.dfit;
    });

    // 对上了名字 → 用TA的名字和画像；对不上 → 用刚才那六道题估一个
    var active = null;
    if (target) {
      list.forEach(function (x) {
        if (x.ch.id === target.id) active = x;
      });
    }
    if (!active) {
      var mine = partnerVector(u);
      var pv = target ? blendVector(target.v, mine, 0.2) : mine;
      var p = pairScore(u, pv);
      active = decorate({
        ch: {
          id: "__custom__",
          name: String(state.b || "对方").slice(0, 12),
          game: "",
          tag: "",
          traits: deriveTraits(pv),
          note: describeOther(pv)
        },
        fit: p.fit,
        tension: p.tension,
        trap: p.trap,
        raw: p.total,
        uType: uType,
        cType: attachType(pv.AX, pv.AV)
      });
    }

    return { kind: "cast", u: u, uType: uType, list: list, hit: !!target, active: active };
  }

  /**
   * ★ 文案：结论文案。五档按「契合高/中 + 张力高/低」组合，最后一句是焦虑-回避陷阱的补充。
   *   想改语气就改这六句，改完这一版所有用 cast 模式的成品都会跟着变。
   */
  function relationLine(a) {
    var base;
    if (a.fit >= 0.68 && a.tension >= 0.55)
      base = "你们会很快靠近，也容易在同一个地方反复受伤——这段关系不无聊，但需要有人先学会停手。";
    else if (a.fit >= 0.68) base = "安稳，像一件穿旧了却舍不得换的衣服。你们的默契不靠戏剧性来证明。";
    else if (a.tension >= 0.62) base = "拉扯感很强。你们互相吸引的那部分，恰好也是彼此最受不了的那部分。";
    else if (a.fit >= 0.52) base = "不算一拍即合，但足够体面。你们能相处，只是需要有人先开口。";
    else base = "礼貌、平静，也很难真正靠近。你们更适合当彼此生命里一个不错的过客。";

    if (a.trap > 0.45) base += " 你是" + a.uType + "，TA偏" + a.cType + "——越追越退，是你们最可能写出来的剧本。";
    return base;
  }

  function castBarsHTML(a) {
    var f = Math.round(a.dfit);
    var t = Math.round(a.dten);
    return (
      '<div class="dual">' +
      '<div class="dual-row"><span>契合</span><i><b style="width:' + f + '%"></b></i><em>' + f + "</em></div>" +
      '<div class="dual-row"><span>张力</span><i><b style="width:' + t + '%"></b></i><em>' + t + "</em></div>" +
      "</div>"
    );
  }

  function castDimsHTML(u) {
    var map = [
      ["O", "开放"],
      ["C", "尽责"],
      ["E", "外向"],
      ["A", "宜人"],
      ["N", "波动"]
    ];
    var out = '<div class="dims">';
    map.forEach(function (m) {
      out += "<span>" + m[1] + "<b>" + Math.round(u[m[0]] || 0) + "</b></span>";
    });
    return out + "</div>";
  }

  function renderCastResult() {
    var r = compute();
    var active = activeFrom(r);
    if (!active) return;

    var ch = active.ch;
    var meta = r.hit ? esc(ch.tag) : "根据你的回答推定";

    app.innerHTML =
      '<section class="sheet">' +
      head(
        "<span>" + esc(CFG.meta.refLabel || "检定编号") + " <b>" + esc(refNo()) + "</b></span>",
        "<span>" + today() + "</span>"
      ) +
      '<div class="sheet-body">' +
      '<p class="kicker">检定结果</p>' +
      '<h1 class="cast-name">' + esc(ch.name) + "</h1>" +
      '<p class="cast-meta">' + meta + "</p>" +
      '<div class="scoreline">' +
      '<span class="pct">' +
      active.score +
      "<small>%</small></span>" +
      '<span class="grade">相性<b>' +
      gradeOf(active.score) +
      "</b></span>" +
      stampHTML(CFG.meta.stamp || "相性检定") +
      "</div>" +
      castBarsHTML(active) +
      '<p class="attach">你的依恋类型 <b>' +
      esc(r.uType) +
      "</b><span>×</span>TA <b>" +
      esc(active.cType) +
      "</b></p>" +
      castDimsHTML(r.u) +
      '<p class="comment">' + esc(relationLine(active)) + "</p>" +
      '<p class="cast-note">' + esc(ch.note) + "</p>" +
      traitsList(ch.traits) +
      '<div class="actions">' +
      '<button class="btn btn--solid" data-action="save">保存为图片</button>' +
      '<button class="btn" data-action="copy">复制文字</button>' +
      '<button class="btn" data-action="again">' + esc(CFG.meta.againLabel || "重新检定") + "</button>" +
      "</div>" +
      '<p class="disclaimer">' + esc(CFG.meta.castNote || "结果仅供娱乐") + "</p>" +
      "</div>" +
      foot("签发 · " + esc(CFG.meta.author || ""), "第 3 / 3 页") +
      "</section>";
  }

  function render() {
    if (state.step === "cover") renderCover();
    else if (state.step === "quiz") renderQuiz();
    else if (CFG.mode === "cast") renderCastResult();
    else renderResult();
    app.setAttribute("data-step", state.step);
  }

  /* ---------------- 交互 ---------------- */

  app.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");

    if (action === "start") {
      var a = app.querySelector('[data-bind="a"]');
      var b = app.querySelector('[data-bind="b"]');
      state.a = (a && a.value.trim()) || CFG.meta.defaultA || "你";
      state.b = (b && b.value.trim()) || CFG.meta.defaultB || "对方";
      state.picks = [];
      state.qi = 0;

      if (CFG.mode === "cast") {
        state.target = findCast(state.b);
        // 两条路的题量必须一致，否则两个人对比一下就能看出结构不同
        state.items = CFG.questions.concat(CFG.partner || []);
      } else {
        state.target = null;
        state.items = CFG.questions.slice();
      }

      state.step = "quiz";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (action === "answer") {
      state.picks[state.qi] = Number(btn.getAttribute("data-i"));
      if (state.qi + 1 < state.items.length) {
        state.qi += 1;
        render();
      } else {
        state.step = "result";
        render();
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (action === "back") {
      if (state.qi === 0) {
        state.step = "cover";
      } else {
        state.qi -= 1;
      }
      render();
      return;
    }

    if (action === "again") {
      state.step = "cover";
      state.qi = 0;
      state.picks = [];
      render();
      return;
    }

    if (action === "save") {
      saveCard();
      return;
    }

    if (action === "copy") {
      copyText();
      return;
    }
  });

  app.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && state.step === "quiz") {
      var first = app.querySelector('[data-action="answer"]');
      if (first) first.click();
    }
  });

  /* ---------------- 结果卡（Canvas） ---------------- */

  var SERIF = '"Songti SC","STSong","Noto Serif SC",SimSun,serif';
  var MONO = '"Consolas","Courier New",monospace';
  var SANS = '"PingFang SC","Microsoft YaHei",sans-serif';

  function cardFileName() {
    var ca = CFG.mode === "cast" ? activeCast() : null;
    var who = ca && ca.ch ? ca.ch.name : CFG.mode === "cast" ? state.b : state.a + "x" + state.b;
    var base = "相性检定_" + (who || "结果");
    return base.replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 40) + ".png";
  }

  function canvasToBlob(canvas) {
    return new Promise(function (resolve, reject) {
      if (canvas.toBlob) {
        canvas.toBlob(function (b) {
          b ? resolve(b) : reject(new Error("浏览器没有返回图片"));
        }, "image/png");
        return;
      }
      // 老浏览器的退路
      try {
        var data = canvas.toDataURL("image/png");
        var bin = atob(data.split(",")[1]);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        resolve(new Blob([arr], { type: "image/png" }));
      } catch (e) {
        reject(e);
      }
    });
  }

  function saveCard() {
    var canvas;
    try {
      canvas = drawCard();
    } catch (err) {
      return toast("导出失败：" + err.message);
    }
    toast("正在生成图片…");
    canvasToBlob(canvas)
      .then(function (blob) {
        showCardPreview(blob, canvas);
      })
      .catch(function (err) {
        toast("导出失败：" + err.message);
      });
  }

  /**
   * 出图后不直接触发下载，先把图摊开。
   * 手机上（尤其微信、小红书内置浏览器）a[download] 常常没反应，
   * 长按保存才是真正能走通的那条路。
   */
  function showCardPreview(blob, canvas) {
    var url = URL.createObjectURL(blob);
    var fileName = cardFileName();
    var file = null;
    try {
      file = new File([blob], fileName, { type: "image/png" });
    } catch (e) {
      file = null;
    }
    var canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));

    var overlay = document.createElement("div");
    overlay.className = "card-modal";
    overlay.setAttribute("role", "dialog");
    overlay.setAttribute("aria-label", "结果图片");
    overlay.innerHTML =
      '<div class="card-modal-inner">' +
      '<img class="card-modal-img" src="' + url + '" alt="相性检定结果图" />' +
      '<p class="card-modal-tip">长按图片可保存到相册</p>' +
      '<div class="card-modal-actions">' +
      (canShare ? '<button class="btn btn--solid" data-modal="share">分享给朋友</button>' : "") +
      '<button class="btn" data-modal="download">下载图片</button>' +
      '<button class="btn" data-modal="close">关闭</button>' +
      "</div>" +
      "</div>";

    document.body.appendChild(overlay);
    document.body.style.overflow = "hidden";

    // 个别内置浏览器不认 blob: 地址，退回 data URL（长按保存更稳）
    var img = overlay.querySelector(".card-modal-img");
    if (img) {
      img.onerror = function () {
        try {
          img.src = canvas.toDataURL("image/png");
        } catch (e) {
          /* 没救了，用户还能点关闭 */
        }
      };
    }

    function close() {
      document.removeEventListener("keydown", onKey);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      document.body.style.overflow = "";
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 400);
    }

    function onKey(ev) {
      if (ev.key === "Escape") close();
    }

    overlay.addEventListener("click", function (ev) {
      var hit = ev.target.closest ? ev.target.closest("[data-modal]") : null;
      if (ev.target === overlay || (hit && hit.getAttribute("data-modal") === "close")) {
        close();
        return;
      }
      if (!hit) return;

      var act = hit.getAttribute("data-modal");
      if (act === "download") {
        var a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        toast("已开始下载");
      } else if (act === "share") {
        navigator
          .share({ files: [file], title: CFG.meta.title || "相性检定" })
          .catch(function () {
            /* 用户取消，不用提示 */
          });
      }
    });

    document.addEventListener("keydown", onKey);
  }

  function drawCard() {
    var r = compute();
    var W = 1080;
    var H = r.kind === "pick" ? 1350 : 1560;
    var c = document.createElement("canvas");
    c.width = W;
    c.height = H;
    var g = c.getContext("2d");

    // 纸底
    g.fillStyle = "#ece3d1";
    g.fillRect(0, 0, W, H);

    // 纤维噪点
    for (var i = 0; i < 5200; i++) {
      var x = Math.random() * W;
      var y = Math.random() * H;
      g.fillStyle = "rgba(90,70,45," + (Math.random() * 0.05).toFixed(3) + ")";
      g.fillRect(x, y, 1.6, 1.6);
    }

    // 暗角
    var vg = g.createRadialGradient(W * 0.4, H * 0.28, 160, W * 0.5, H * 0.5, 1150);
    vg.addColorStop(0, "rgba(255,255,255,0.34)");
    vg.addColorStop(0.55, "rgba(255,255,255,0)");
    vg.addColorStop(1, "rgba(70,50,28,0.20)");
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);

    // 外框
    g.strokeStyle = "rgba(27,26,23,0.5)";
    g.lineWidth = 2;
    g.strokeRect(46, 46, W - 92, H - 92);

    // 左上角裁切标记
    g.strokeStyle = "rgba(27,26,23,0.35)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(66, 84);
    g.lineTo(66, 66);
    g.lineTo(84, 66);
    g.moveTo(W - 66, H - 84);
    g.lineTo(W - 66, H - 66);
    g.lineTo(W - 84, H - 66);
    g.stroke();

    // 页眉
    g.textBaseline = "alphabetic";
    g.fillStyle = "#857b6a";
    g.font = "500 24px " + MONO;
    g.textAlign = "left";
    g.fillText((CFG.meta.refLabel || "检定编号") + "  " + refNo(), 92, 132);
    g.textAlign = "right";
    g.fillText(today(), W - 92, 132);

    g.strokeStyle = "rgba(27,26,23,0.28)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(92, 162);
    g.lineTo(W - 92, 162);
    g.stroke();

    if (r.kind === "cast") drawCastBody(g, W, H, r);
    else if (r.kind === "pick") drawPickBody(g, W, H, r);
    else drawMatchBody(g, W, H, r);

    drawFoot(g, W, H);
    return c;
  }

  function drawFoot(g, W, H) {
    g.strokeStyle = "rgba(27,26,23,0.16)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(92, H - 128);
    g.lineTo(W - 92, H - 128);
    g.stroke();

    g.fillStyle = "#857b6a";
    g.font = "500 22px " + MONO;
    g.textBaseline = "alphabetic";
    g.textAlign = "left";
    g.fillText("签发 · " + (CFG.meta.author || ""), 92, H - 82);
    g.textAlign = "right";
    g.fillText(CFG.meta.cardFoot || "仅供娱乐", W - 92, H - 82);

    // 成图会被人存下来发出去，页脚印一个地址，等于自带出处
    if (CFG.meta.siteUrl) {
      g.textAlign = "center";
      g.fillStyle = "#9a9182";
      g.font = "500 20px " + MONO;
      g.fillText(CFG.meta.siteUrl, W / 2, H - 82);
    }
    g.textAlign = "left";
  }

  function drawTraits(g, W, list, startY) {
    var traits = list || [];
    var ty = startY;
    g.strokeStyle = "rgba(27,26,23,0.16)";
    g.lineWidth = 1;
    traits.slice(0, 3).forEach(function (t, idx) {
      g.beginPath();
      g.moveTo(92, ty - 34);
      g.lineTo(W - 92, ty - 34);
      g.stroke();
      g.fillStyle = "#857b6a";
      g.font = "500 20px " + MONO;
      g.fillText("0" + (idx + 1), 92, ty);
      g.fillStyle = "#1b1a17";
      g.font = "400 28px " + SERIF;
      g.fillText(t, 172, ty);
      ty += 74;
    });
  }

  function drawMatchBody(g, W, H, r) {
    var band = r.band || {};

    // 标签
    g.textAlign = "left";
    g.fillStyle = "#a32b22";
    g.font = "600 22px " + MONO;
    g.fillText("相 性 检 定", 92, 232);

    // 名字
    g.fillStyle = "#1b1a17";
    g.font = "700 52px " + SERIF;
    g.fillText(fit(g, state.a + " × " + state.b, W - 184, 52), 92, 306);

    // 结论名
    g.fillStyle = "#857b6a";
    g.font = "400 24px " + SERIF;
    g.fillText(band.name || "", 92, 352);

    // 大百分比
    g.fillStyle = "#1b1a17";
    g.font = "700 200px " + SERIF;
    var pctText = String(r.pct);
    g.fillText(pctText, 84, 580);
    var pw = g.measureText(pctText).width;
    g.fillStyle = "#857b6a";
    g.font = "600 54px " + SERIF;
    g.fillText("%", 92 + pw + 6, 580);

    // 评级
    g.fillStyle = "#857b6a";
    g.font = "500 22px " + MONO;
    g.fillText("评级", 96, 646);
    g.fillStyle = "#a32b22";
    g.font = "700 62px " + SERIF;
    g.fillText(band.grade || "", 96, 716);

    // 印章
    drawStamp(g, W - 200, 500, 108, CFG.meta.stamp || "检定专用");

    // 进度条
    g.fillStyle = "rgba(27,26,23,0.14)";
    g.fillRect(92, 776, W - 184, 8);
    g.fillStyle = "#a32b22";
    g.fillRect(92, 776, ((W - 184) * r.pct) / 100, 8);

    // 评语
    g.fillStyle = "#a32b22";
    g.fillRect(92, 846, 3, 26);
    g.fillStyle = "#4f483c";
    g.font = "400 30px " + SERIF;
    wrap(g, band.comment || "", 116, 872, W - 232, 52, 4);

    drawTraits(g, W, band.traits, 1112);
  }

  function drawPickBody(g, W, H, r) {
    var hit = r.result || {};

    // 标签
    g.textAlign = "left";
    g.fillStyle = "#a32b22";
    g.font = "600 22px " + MONO;
    g.fillText(CFG.meta.resultKicker || "今日签文", 92, 232);

    // 标题：按「·」拆两行，视觉上更有分量
    var name = hit.name || "";
    var parts = name
      .split("·")
      .map(function (s) {
        return s.trim();
      })
      .filter(Boolean);
    g.fillStyle = "#1b1a17";
    if (parts.length === 2) {
      g.font = "700 86px " + SERIF;
      g.fillText(parts[0], 92, 356);
      g.fillText(parts[1], 92, 462);
    } else {
      g.font = "700 86px " + SERIF;
      g.fillText(fit(g, name, W - 184, 86), 92, 400);
    }

    // 宜忌
    if (hit.sub) {
      g.fillStyle = "#857b6a";
      g.font = "400 26px " + SERIF;
      g.fillText(hit.sub, 92, 536);
    }

    // 分隔
    g.strokeStyle = "rgba(27,26,23,0.22)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(92, 590);
    g.lineTo(W - 92, 590);
    g.stroke();

    // 评语
    g.fillStyle = "#a32b22";
    g.fillRect(92, 636, 3, 26);
    g.fillStyle = "#4f483c";
    g.font = "400 32px " + SERIF;
    wrap(g, hit.comment || "", 116, 662, W - 232, 56, 3);

    drawTraits(g, W, hit.traits, 900);
  }

  function activeFrom(r) {
    if (!r) return null;
    return r.active || (r.list && r.list[0]) || null;
  }

  function activeCast() {
    return activeFrom(compute());
  }

  function barRow(g, W, y, label, val) {
    g.textAlign = "left";
    g.fillStyle = "#857b6a";
    g.font = "500 22px " + MONO;
    g.fillText(label, 92, y);

    var x0 = 172;
    var x1 = W - 176;
    g.fillStyle = "rgba(27,26,23,0.14)";
    g.fillRect(x0, y - 11, x1 - x0, 8);
    g.fillStyle = "#a32b22";
    g.fillRect(x0, y - 11, ((x1 - x0) * val) / 100, 8);

    g.textAlign = "right";
    g.fillStyle = "#1b1a17";
    g.font = "600 24px " + MONO;
    g.fillText(String(Math.round(val)), W - 92, y);
    g.textAlign = "left";
  }

  function drawCastBody(g, W, H, r) {
    var active = activeFrom(r);
    if (!active) return;
    var ch = active.ch;
    var rank = r.list.indexOf(active) + 1;

    // 标签
    g.textAlign = "left";
    g.fillStyle = "#a32b22";
    g.font = "600 22px " + MONO;
    g.fillText("相 性 检 定", 92, 232);

    // 角色名
    g.fillStyle = "#1b1a17";
    g.font = "700 96px " + SERIF;
    g.fillText(fit(g, ch.name, W - 184, 96), 92, 356);

    // 出处与人设
    g.fillStyle = "#857b6a";
    g.font = "400 26px " + SERIF;
    g.fillText(ch.tag ? ch.tag : "根据你的回答推定", 92, 412);

    // 大百分比
    g.fillStyle = "#1b1a17";
    g.font = "700 190px " + SERIF;
    var pctText = String(active.score);
    g.fillText(pctText, 84, 600);
    var pw = g.measureText(pctText).width;
    g.fillStyle = "#857b6a";
    g.font = "600 54px " + SERIF;
    g.fillText("%", 92 + pw + 6, 600);

    // 评级
    g.fillStyle = "#857b6a";
    g.font = "500 22px " + MONO;
    g.fillText("相性", 96, 666);
    g.fillStyle = "#a32b22";
    g.font = "700 62px " + SERIF;
    g.fillText(gradeOf(active.score), 96, 736);

    // 印章
    drawStamp(g, W - 200, 520, 108, CFG.meta.stamp || "相性检定");

    // 双通道
    barRow(g, W, 790, "契合", active.dfit);
    barRow(g, W, 832, "张力", active.dten);

    // 依恋
    g.fillStyle = "#857b6a";
    g.font = "400 26px " + SERIF;
    g.fillText("你的依恋类型 " + r.uType + "　×　TA " + active.cType, 92, 892);

    // 评语
    g.fillStyle = "#a32b22";
    g.fillRect(92, 936, 3, 26);
    g.fillStyle = "#4f483c";
    g.font = "400 30px " + SERIF;
    wrap(g, relationLine(active), 116, 962, W - 232, 50, 4);

    drawTraits(g, W, ch.traits, 1178);
  }

  function drawStamp(g, cx, cy, rad, text) {
    g.save();
    g.translate(cx, cy);
    g.rotate((-11 * Math.PI) / 180);
    g.globalAlpha = 0.9;
    g.strokeStyle = "#a32b22";
    g.fillStyle = "#a32b22";
    g.lineWidth = 7;
    g.beginPath();
    g.arc(0, 0, rad, 0, Math.PI * 2);
    g.stroke();
    g.lineWidth = 2;
    g.beginPath();
    g.arc(0, 0, rad - 13, 0, Math.PI * 2);
    g.stroke();

    var chars = String(text).split("");
    var half = Math.ceil(chars.length / 2);
    var lineA = chars.slice(0, half).join("");
    var lineB = chars.slice(half).join("");
    g.font = "700 38px " + SERIF;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(lineA, 0, -26);
    g.fillText(lineB, 0, 28);
    g.restore();
  }

  function fit(g, text, maxW, base) {
    var size = base;
    while (size > 20) {
      g.font = "700 " + size + "px " + SERIF;
      if (g.measureText(text).width <= maxW) break;
      size -= 2;
    }
    return text;
  }

  function wrap(g, text, x, y, maxW, lineH, maxLines) {
    // 避头点：这些符号不另起一行，宁可让上一行稍微超宽
    var NO_START = "。，、；：？！）」』】》.,!?;:)%";
    var line = "";
    var lines = 0;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var test = line + ch;
      if (line && g.measureText(test).width > maxW) {
        if (NO_START.indexOf(ch) >= 0) {
          line = test;
          continue;
        }
        g.fillText(line, x, y);
        lines++;
        y += lineH;
        line = ch;
        if (maxLines && lines >= maxLines - 1) {
          // 收尾：把剩下的都塞进最后一行（省略）
          var rest = text.slice(i);
          while (g.measureText(rest + "…").width > maxW && rest.length > 1) rest = rest.slice(0, -1);
          g.fillText(rest + "…", x, y);
          return;
        }
      } else {
        line = test;
      }
    }
    if (line) g.fillText(line, x, y);
  }

  /* ---------------- 复制文本 ---------------- */

  function copyText() {
    var r = compute();
    var text = "";
    if (CFG.mode === "cast") {
      var cr = compute();
      var ca = activeFrom(cr);
      if (ca) {
        text =
          "【相性检定】我 × " +
          ca.ch.name +
          "\n相性 " +
          ca.score +
          "%  ·  契合 " +
          Math.round(ca.dfit) +
          "  ·  张力 " +
          Math.round(ca.dten) +
          "\n我的依恋类型：" +
          cr.uType +
          "　TA：" +
          ca.cType +
          "\n" +
          relationLine(ca);
      }
    } else if (r.kind === "pick") {
      var hit = r.result || {};
      text = "【" + (CFG.meta.title || "") + "】" + hit.name + "\n" + (hit.comment || "");
    } else {
      var b = r.band || {};
      text =
        "【" +
        (CFG.meta.title || "相性检定") +
        "】" +
        state.a +
        " × " +
        state.b +
        "\n相性 " +
        r.pct +
        "%  ·  评级 " +
        (b.grade || "") +
        "  ·  " +
        (b.name || "") +
        "\n" +
        (b.comment || "");
    }
    text += "\n— " + (CFG.meta.author || "");

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () {
          toast("已复制");
        },
        function () {
          toast("复制失败，请手动选择");
        }
      );
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        toast("已复制");
      } catch (e) {
        toast("复制失败");
      }
      document.body.removeChild(ta);
    }
  }

  /* ---------------- 主题变量 ---------------- */

  /* ---------------- 预览深链 ----------------
     #p=quiz / #p=result 可直接跳到对应页面，方便接单时给客户看效果。 */

  var previewMode = "";

  (function preview() {
    var m = /[#&]p=(cover|quiz|result|card|export)/.exec(window.location.hash || "");
    if (!m || m[1] === "cover") return;
    state.a = CFG.meta.defaultA || "你";
    state.b = CFG.meta.defaultB || "对方";

    // &c=角色id 指定命中某位角色；&c=none 强制走通用模型；&q=N 指定看第 N 题
    var cm = /[#&]c=([\w-]+)/.exec(window.location.hash || "");
    var qm = /[#&]q=(\d+)/.exec(window.location.hash || "");
    if (CFG.mode === "cast") {
      var forced = cm ? cm[1] : "";
      if (forced === "none") {
        state.target = null;
      } else if (forced) {
        (CFG.cast || []).forEach(function (ch) {
          if (ch.id === forced) state.target = ch;
        });
      } else {
        state.target = findCast(state.b);
      }
      state.items = CFG.questions.concat(CFG.partner || []);
      if (state.target) state.b = state.target.name;
    } else {
      state.items = CFG.questions.slice();
    }

    state.picks = state.items.map(function (q, i) {
      var n = CFG.likert ? CFG.likert.length : q.options.length;
      return hash(state.a + "|" + i) % n;
    });
    state.qi = m[1] === "quiz" ? (qm ? Math.min(Number(qm[1]), state.items.length - 1) : Math.min(2, state.items.length - 1)) : 0;
    state.step = m[1] === "quiz" ? "quiz" : "result";
    previewMode = m[1];
  })();

  var theme = (CFG.meta && CFG.meta.theme) || null;
  if (theme) {
    Object.keys(theme).forEach(function (k) {
      document.documentElement.style.setProperty("--" + k, theme[k]);
    });
  }

  render();

  /* 调试钩子：给分布测试用，不影响正常使用 */
  window.__OCKIT__ = {
    cast: function (picks) {
      state.items = CFG.questions.slice();
      state.picks = picks;
      state.target = null;
      state.b = "对方";
      return computeCast();
    },
    findCast: findCast,
    pairScore: pairScore,
    attachType: attachType
  };

  /* #p=card 直接把导出图铺在页面上，用来核对成图效果 */
  if (previewMode === "card") {
    var card = drawCard();
    app.innerHTML =
      '<img class="card-preview" alt="结果卡预览" src="' + card.toDataURL("image/png") + '" />';
  }

  /* #p=export 走一遍真实导出流程，用来核对保存弹层 */
  if (previewMode === "export") {
    saveCard();
  }
})();
</script>
